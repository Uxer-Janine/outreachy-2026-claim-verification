<svg xmlns="http://www.w3.org/2000/svg" width="640" height="537" viewBox="0 0 640 537" role="img" aria-labelledby="title desc">
  <title id="title">The surrogacy claim breaks into three checks</title>
  <desc id="desc">The documented A04 assessment finds partial support for the attribution, support for the revenue amount, and no support for the clinic count. Overall partially supported, awaiting independent review.</desc>
  <rect x="1" y="1" width="638" height="535" rx="18" fill="#121b1e" stroke="#617977" stroke-width="2"/>
  <g font-family="system-ui, 'Segoe UI', sans-serif">
    <text x="25" y="43" font-size="24" fill="#f2ca82" font-weight="700">A04 · SURROGACY IN INDIA</text><rect x="25" y="65" width="590" height="78" rx="12" fill="#1b292d" stroke="#617977"/><text x="44" y="97" font-size="27" fill="#f5f1e7" font-weight="700">Who made the estimate?</text><text x="44" y="126" font-size="23" fill="#b9cac6">Partially supported · One organization is named.</text><rect x="25" y="153" width="590" height="78" rx="12" fill="#1b292d" stroke="#617977"/><text x="44" y="185" font-size="27" fill="#f5f1e7" font-weight="700">Was it above US$2 billion?</text><text x="44" y="214" font-size="23" fill="#b9cac6">Supported · The estimate is US$2.3 billion.</text><rect x="25" y="241" width="590" height="78" rx="12" fill="#1b292d" stroke="#617977"/><text x="44" y="273" font-size="27" fill="#f5f1e7" font-weight="700">Is a clinic count established?</text><text x="44" y="302" font-size="23" fill="#b9cac6">Not supported · The passage gives no count.</text><path d="M320 321L320 352" fill="none" stroke="#f2ca82" stroke-width="2"/><rect x="25" y="352" width="590" height="153" rx="12" fill="#173b34" stroke="#a2e2c7"/><text x="44" y="393" font-size="31" fill="#f5f1e7" font-weight="700">Overall · Partially supported</text><text x="44" y="430" font-size="25" fill="#a2e2c7">Confidence · Medium</text><text x="44" y="470" font-size="25" fill="#f2ca82" font-weight="700">Awaiting independent review</text>
  </g>
</svg>
